<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1180"
     height="610"
     viewBox="0 0 1180 610">

<defs>

<linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#030712">
<animate attributeName="stop-color"
values="#030712;#0F172A;#030712"
dur="12s"
repeatCount="indefinite"/>
</stop>
<stop offset="100%" stop-color="#0F172A">
<animate attributeName="stop-color"
values="#0F172A;#111827;#0F172A"
dur="12s"
repeatCount="indefinite"/>
</stop>
</linearGradient>

<linearGradient id="accent"
x1="0%"
y1="0%"
x2="100%"
y2="0%">

<stop offset="0%" stop-color="#7C3AED">
<animate attributeName="stop-color"
values="#7C3AED;#22D3EE;#10B981;#7C3AED"
dur="10s"
repeatCount="indefinite"/>
</stop>

<stop offset="100%" stop-color="#22D3EE">
<animate attributeName="stop-color"
values="#22D3EE;#10B981;#7C3AED;#22D3EE"
dur="10s"
repeatCount="indefinite"/>
</stop>

</linearGradient>

<filter id="shadow">
<feDropShadow dx="0"
dy="0"
stdDeviation="10"
flood-color="#22D3EE"
flood-opacity=".4"/>
</filter>

<filter id="blur">
<feGaussianBlur stdDeviation="40"/>
</filter>

<filter id="glow">
<feGaussianBlur stdDeviation="5"
result="blur"/>
<feMerge>
<feMergeNode in="blur"/>
<feMergeNode in="SourceGraphic"/>
</feMerge>
</filter>

</defs>

<rect width="1180"
height="610"
rx="28"
fill="url(#bgGrad)"/>

<circle cx="220"
cy="120"
r="140"
fill="#22D3EE"
opacity=".15"
filter="url(#blur)">
<animate attributeName="cx"
values="220;260;220"
dur="10s"
repeatCount="indefinite"/>
</circle>

<circle cx="980"
cy="500"
r="180"
fill="#7C3AED"
opacity=".12"
filter="url(#blur)">
<animate attributeName="cy"
values="500;450;500"
dur="14s"
repeatCount="indefinite"/>
</circle>

