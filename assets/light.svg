<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1180"
     height="610"
     viewBox="0 0 1180 610">

<defs>

<linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#FFFFFF">
<animate attributeName="stop-color"
values="#FFFFFF;#F8FAFC;#FFFFFF"
dur="12s"
repeatCount="indefinite"/>
</stop>

<stop offset="100%" stop-color="#F8FAFC">
<animate attributeName="stop-color"
values="#F8FAFC;#EEF2FF;#F8FAFC"
dur="12s"
repeatCount="indefinite"/>
</stop>

</linearGradient>

<linearGradient id="accent"
x1="0%"
y1="0%"
x2="100%"
y2="0%">

<stop offset="0%" stop-color="#2563EB">
<animate attributeName="stop-color"
values="#2563EB;#06B6D4;#10B981;#2563EB"
dur="10s"
repeatCount="indefinite"/>
</stop>

<stop offset="100%" stop-color="#06B6D4">
<animate attributeName="stop-color"
values="#06B6D4;#10B981;#2563EB;#06B6D4"
dur="10s"
repeatCount="indefinite"/>
</stop>

</linearGradient>

<filter id="shadow">
<feDropShadow
dx="0"
dy="0"
stdDeviation="10"
flood-color="#2563EB"
flood-opacity=".25"/>
</filter>

<filter id="blur">
<feGaussianBlur stdDeviation="40"/>
</filter>

<filter id="glow">
<feGaussianBlur stdDeviation="5" result="blur"/>
<feMerge>
<feMergeNode in="blur"/>
<feMergeNode in="SourceGraphic"/>
</feMerge>
</filter>

</defs>

<rect
width="1180"
height="610"
rx="28"
fill="url(#bgGrad)"/>

<circle
cx="220"
cy="120"
r="140"
fill="#06B6D4"
opacity=".10"
filter="url(#blur)">

<animate
attributeName="cx"
values="220;260;220"
dur="10s"
repeatCount="indefinite"/>

</circle>

<circle
cx="980"
cy="500"
r="180"
fill="#2563EB"
opacity=".08"
filter="url(#blur)">

<animate
attributeName="cy"
values="500;450;500"
dur="14s"
repeatCount="indefinite"/>

</circle>

<rect
x="35"
y="35"
width="1110"
height="540"
rx="24"
fill="#F8FAFC"
fill-opacity=".90"
stroke="rgba(15,23,42,.08)"
filter="url(#shadow)"/>

<g transform="translate(70 90)">

<text
font-family="monospace"
font-size="15"
fill="url(#accent)"
filter="url(#glow)">

<tspan x="0" y="0">██╗   ██╗███████╗███████╗██████╗ </tspan>
<tspan x="0" y="24">██║   ██║██╔════╝██╔════╝██╔══██╗</tspan>
<tspan x="0" y="48">██║   ██║█████╗  █████╗  ██████╔╝</tspan>
<tspan x="0" y="72">╚██╗ ██╔╝██╔══╝  ██╔══╝  ██╔══██╗</tspan>
<tspan x="0" y="96"> ╚████╔╝ ███████╗███████╗██║  ██║</tspan>
<tspan x="0" y="120">  ╚═══╝  ╚══════╝╚══════╝╚═╝  ╚═╝</tspan>

<animateTransform
attributeName="transform"
type="translate"
values="0 0;0 -6;0 0"
dur="5s"
repeatCount="indefinite"/>

</text>

